
# ==========================================
# PRODUCTS SERVICE - CONFIGURACION GENERAL
# ==========================================

# Identidad del microservicio
spring.application.name=products-service
server.port=8080

# ==========================================
# ACTUATOR - MONITOREO Y ESTADO
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informacion del microservicio
info.app.name=products-service
info.app.description=Microservicio de gestion de productos
info.app.version=1.0.0

# ==========================================
# EUREKA CLIENT - REGISTRO DEL MICROSERVICIO
# ==========================================

# Eureka Server ejecutandose localmente en IntelliJ
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Registrar el microservicio en Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Identificacion de la instancia
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# URLs de monitoreo
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

# ==========================================
# TRACING - TRAZABILIDAD
# ==========================================

management.tracing.sampling.probability=1.0
